aid: mech-mind
name: Mech-Mind Robotics
description: >-
  Mech-Mind Robotics provides industrial 3D cameras (the Mech-Eye industrial 3D
  camera and laser profiler line) together with software suites — Mech-Vision
  machine-vision software, Mech-Viz robot-programming software, and the Mech-DLK
  deep-learning toolkit — that give industrial robots embodied AI and 3D vision.
  Typical applications include bin picking, depalletizing, machine tending,
  piece picking, and item picking; the company reports 3000+ deployed
  applications for 1000+ clients worldwide. The developer surface is the
  Mech-Eye SDK (a C++ core with Python and C# bindings), ROS and ROS2 interfaces,
  and the Mech-DLK SDK, all published under the MechMindRobotics GitHub
  organization; there is no public REST/HTTP API.
