description: >-
  First-party client libraries for the Mech-Eye 3D Camera / Laser Profiler SDK
  (Mech-Eye API) and the Mech-DLK deep-learning SDK. Mech-Mind ships no public
  REST API; the developer surface is the Mech-Eye SDK (a C++ core with Python
  and C# bindings) plus ROS/ROS2 interfaces, distributed as an installer from
  downloads.mech-mind.com and mirrored as open-source repositories under the
  MechMindRobotics GitHub organization.
